apiVersion: v1
kind: Namespace
metadata:
  name: keyvault-eso-spike
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: floci-keyvault
  namespace: keyvault-eso-spike
spec:
  provider:
    webhook:
      url: "http://floci.platform.svc:4577/devstoreaccount1-keyvault/secrets/{{ .remoteRef.key }}?api-version=7.4"
      method: GET
      headers:
        Authorization: "Bearer synthetic-local-test"
      result:
        jsonPath: "$.value"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proof
  namespace: keyvault-eso-spike
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: floci-keyvault
    kind: SecretStore
  target:
    name: proof
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: value
      remoteRef:
        key: eso-spike-proof
