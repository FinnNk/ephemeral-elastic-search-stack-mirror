name: Build search spike
on:
  push:
    branches: ['main']
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    runs-on: lab
    steps:
      - name: Fetch exact source, test, build and publish
        env:
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
          RUN_ID: ${{ gitea.run_id }}
          RUN_ATTEMPT: ${{ gitea.run_attempt }}
          SOURCE_SHA: ${{ gitea.event.pull_request.head.sha || gitea.sha }}
        run: |
          set -eu
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'elastic-agent:%s' "$BUILD_TOKEN" | base64 | tr -d '\n')"
          git init source
          cd source
          git remote add origin http://gitea-http.platform.svc.cluster.local:31800/elastic-agent/search-spike.git
          git fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s' "$BUILD_TOKEN" | docker login gitea.localhost:31800 -u elastic-agent --password-stdin
          IMAGE="gitea.localhost:31800/elastic-agent/search-spike:$SOURCE_SHA-$RUN_ID-$RUN_ATTEMPT"
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{index .RepoDigests 0}}'
