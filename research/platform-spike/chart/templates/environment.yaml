apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.environment }}
  labels:
    lab: search-spike
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: {{ .Values.environment }}
  annotations:
    lab/fingerprint: {{ .Values.fingerprint | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.image_pull_secret | default "registry-read" }}
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ES_URL
              value: https://shared-es-http.platform.svc:9200
            - name: ES_INDEX
              value: {{ .Values.index | quote }}
            {{- if .Values.rewrite_redis_key }}
            - name: REWRITE_REDIS_HOST
              value: lab-redis.platform.svc.cluster.local
            - name: REWRITE_REDIS_KEY
              value: {{ .Values.rewrite_redis_key | quote }}
            - name: REWRITE_CATALOGUE_SHA256
              value: {{ .Values.dataset_sha256 | quote }}
            {{- end }}
            {{- if .Values.variant_config_b64 }}
            - name: SEARCH_VARIANTS_JSON
              value: {{ .Values.variant_config_b64 | b64dec | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lab-otel-gateway.lab-observability.svc.cluster.local:4318
            - name: LAB_RELEASE_SHA
              value: {{ .Values.image | quote }}
            - name: LAB_DEPLOYMENT_TIER
              value: preview
          envFrom:
            - secretRef:
                name: search-access
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: es-ca
              mountPath: /es-ca
              readOnly: true
      volumes:
        - name: es-ca
          secret:
            secretName: es-ca
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: {{ .Values.environment }}
spec:
  selector:
    app: search
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-boundary
  namespace: {{ .Values.environment }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab-control
          podSelector:
            matchLabels:
              app: lab-control
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab-evaluation
          podSelector:
            matchExpressions:
              - {key: lab, operator: In, values: [gatling, evaluator]}
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app: lab-redis
      ports:
        - port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              elasticsearch.k8s.elastic.co/cluster-name: shared
      ports:
        - port: 9200
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: lab-observability
          podSelector:
            matchLabels:
              app: lab-otel-gateway
      ports:
        - port: 4318
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment
  namespace: {{ .Values.environment }}
spec:
  hard:
    pods: '3'
    requests.cpu: 250m
    requests.memory: 128Mi
    limits.cpu: '1'
    limits.memory: 384Mi
