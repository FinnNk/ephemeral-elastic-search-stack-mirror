apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: search-environments
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - git:
        repoURL: https://gitea-internal.lab-ingress.svc.cluster.local/elastic-agent/environment-state.git
        revision: main
        requeueAfterSeconds: 5
        files:
          - path: environments/*.json
  template:
    metadata:
      name: '{{.environment}}'
    spec:
      project: default
      source:
        repoURL: https://gitea-internal.lab-ingress.svc.cluster.local/elastic-agent/environment-state.git
        targetRevision: main
        path: chart
        helm:
          parameters:
            - name: environment
              value: '{{.environment}}'
            - name: image
              value: '{{.image}}'
            - name: index
              value: '{{.index}}'
            - name: fingerprint
              value: '{{.fingerprint}}'
            - name: variant_config_b64
              value: '{{if hasKey . "variant_config_b64"}}{{.variant_config_b64}}{{end}}'
            - name: image_pull_secret
              value: '{{if hasKey . "image_pull_secret"}}{{.image_pull_secret}}{{else}}registry-read{{end}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.environment}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
