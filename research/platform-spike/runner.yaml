apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-data
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runner-docker
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-config
  namespace: platform
data:
  config.yaml: |
    runner:
      capacity: 1
      timeout: 15m
      shutdown_timeout: 30s
    cache:
      enabled: false
  daemon.json: |
    {"insecure-registries":["gitea.localhost:31800"],"dns":["10.43.0.10"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-runner
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: build-runner
  template:
    metadata:
      labels:
        app: build-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: volume-owner
          image: busybox:1.37.0
          command: [sh, -c, 'chown 1000:1000 /runner-data /docker-data']
          volumeMounts:
            - name: data
              mountPath: /runner-data
            - name: docker
              mountPath: /docker-data
      containers:
        - name: runner
          image: gitea/runner:3.5.0-dind-rootless
          securityContext:
            privileged: true
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea.localhost:31800
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runner-registration
                  key: token
            - name: GITEA_RUNNER_NAME
              value: lab-rootless
            - name: GITEA_RUNNER_LABELS
              value: lab:host
            - name: CONFIG_FILE
              value: /config/config.yaml
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: '1'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: docker
              mountPath: /home/rootless/.local/share/docker
            - name: config
              mountPath: /config
            - name: config
              mountPath: /home/rootless/.config/docker/daemon.json
              subPath: daemon.json
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: runner-data
        - name: docker
          persistentVolumeClaim:
            claimName: runner-docker
        - name: config
          configMap:
            name: runner-config
