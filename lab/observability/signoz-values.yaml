# SigNoz Community 0.143.0, chart 0.143.0. See docs/observability-backend.md.
# These images were checked for linux/amd64 and linux/arm64 manifests.
global:
  storageClass: local-path
  clusterName: relevance-lab
clickhouse:
  nodeSelector: &observabilityNode
    lab.relevance/role: observability
  persistence:
    size: 20Gi
  image:
    tag: 25.12.5@sha256:cacf32d6884291dc2ff5e0156a97f46fc53ff7c929a7906d114e268a929dfd3a
  zookeeper:
    nodeSelector: *observabilityNode
    image:
      tag: 3.7.1@sha256:fcc4a3288154ccaa3bdb5ae6dc10180c084d29a8a6a26b62ac8e30a8940dc2e6
  clickhouseOperator:
    nodeSelector: *observabilityNode
    image:
      tag: 0.21.2@sha256:cd9252644ce0a1a26feea66eb77edbfe91b10dec2634b7b8ad73fa3196551488
    metricsExporter:
      image:
        tag: 0.21.2@sha256:df3d57215356043a2b5bcc03a9cdb62198b907932c7077131e079fae1c01156c
  initContainers:
    udf:
      image:
        tag: 3.18.2@sha256:82d1e9d7ed48a7523bdebc18cf6290bdb97b82302a8a9c27d4fe885949ea94d1
      command:
        - sh
        - -c
        - |
          set -eu
          case "$(uname -m)" in
            x86_64) arch=amd64; expected=33997073eb6d82b7be4f27f9fc8ec9e28a395e0f20674d5d54bb2fa28a75488d ;;
            aarch64) arch=arm64; expected=e5605ebffa82a450ebbcdf6cf19dad546e1e40d52dbf3e03cfd2d2d5b7394211 ;;
            *) echo 'Unsupported histogram UDF architecture' >&2; exit 1 ;;
          esac
          cd /tmp
          wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2Fv0.0.1/histogram-quantile_linux_${arch}.tar.gz"
          echo "${expected}  histogram-quantile.tar.gz" | sha256sum -c -
          tar -xzf histogram-quantile.tar.gz
          chmod +x histogram-quantile
          mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
signoz:
  nodeSelector: *observabilityNode
  image:
    tag: v0.143.0@sha256:7da6b9c07db100cfcf7949966211b16543e3d6828df31f0f7a24110d734a811c
  persistence:
    size: 1Gi
telemetryStoreMigrator:
  nodeSelector: *observabilityNode
otelCollector:
  nodeSelector: *observabilityNode
  image:
    tag: v0.144.11@sha256:403e83145e4ca435cbac02f2022fe1635ceadb908fad723e8b1fb1915e26af83
