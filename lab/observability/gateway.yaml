apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-otel-gateway
  namespace: lab-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      attributes/redact:
        actions:
          - {key: query, action: delete}
          - {key: search.query, action: delete}
          - {key: db.statement, action: delete}
          - {key: product.body, action: delete}
          - {key: authorization, action: delete}
      batch:
        timeout: 1s
        send_batch_size: 512
    exporters:
      otlp/backend:
        endpoint: signoz-otel-collector.lab-observability.svc.cluster.local:4317
        tls: {insecure: true}
        sending_queue:
          enabled: true
          queue_size: 512
        retry_on_failure:
          enabled: true
          max_elapsed_time: 30s
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlp/backend]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlp/backend]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlp/backend]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-otel-gateway
  namespace: lab-observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-otel-gateway}
  template:
    metadata:
      labels: {app: lab-otel-gateway}
    spec:
      nodeSelector:
        lab.relevance/role: observability
      containers:
        - name: collector
          image: docker.io/otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          args: [--config=/etc/otel/config.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
      volumes:
        - name: config
          configMap: {name: lab-otel-gateway}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-otel-gateway
  namespace: lab-observability
spec:
  selector: {app: lab-otel-gateway}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
