name: Offline relevance gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  relevance:
    runs-on: lab-delivery
    steps:
      - name: Read target code and candidate changes
        env:
          SOURCE_URL: ${{ vars.SOURCE_BASE_URL || github.server_url }}/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_USER: ${{ secrets.SOURCE_USER }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -eu
          test "$HEAD_REPOSITORY" = "$SOURCE_REPOSITORY"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf '%s:%s' "$SOURCE_USER" "$SOURCE_TOKEN" | base64 | tr -d '\n')"
          git init source
          cd source
          git remote add origin "$SOURCE_URL"
          git fetch --no-tags origin "$BASE_SHA" "$SOURCE_SHA"
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          mkdir ../gate-input
          git diff --raw --no-abbrev --no-renames -z "$BASE_SHA...$SOURCE_SHA" > ../gate-input/changes.bin
          if git cat-file -e "$SOURCE_SHA:gate/selection.json"; then
            git show "$SOURCE_SHA:gate/selection.json" > ../gate-input/selection.json
          fi
      - name: Queue the exact commit comparison
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LAB_DELIVERY_URL: ${{ vars.LAB_DELIVERY_URL }}
          LAB_OIDC_ISSUER: ${{ vars.LAB_OIDC_ISSUER }}
          LAB_OIDC_EDGE_IP: ${{ vars.LAB_OIDC_EDGE_IP }}
          LAB_DELIVERY_CLIENT_SECRET: ${{ secrets.LAB_DELIVERY_CLIENT_SECRET }}
          LAB_DELIVERY_CLIENT_SHA256: ${{ vars.LAB_DELIVERY_CLIENT_SHA256 }}
        run: |
          set -eu
          test "$(sha256sum source/ci/lab_delivery.py | cut -d ' ' -f 1)" = "$LAB_DELIVERY_CLIENT_SHA256"
          PYTHON_IMAGE='python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844'
          docker run --rm -v "$PWD/source:/trusted:ro" -v /etc/lab-ca:/etc/lab-ca:ro \
            --add-host "control.localhost:$LAB_OIDC_EDGE_IP" --add-host "identity.localhost:$LAB_OIDC_EDGE_IP" \
            -e SOURCE_SHA -e BASE_SHA -e PR_NUMBER -e LAB_DELIVERY_URL -e LAB_OIDC_ISSUER \
            -e LAB_DELIVERY_CLIENT_SECRET -e LAB_CA_BUNDLE=/etc/lab-ca/root.pem \
            "$PYTHON_IMAGE" sh -ec '
              python /trusted/ci/lab_delivery.py source-compare --pr "$PR_NUMBER" \
                --source-sha "$SOURCE_SHA" --baseline-sha "$BASE_SHA" \
                --key "pr-$PR_NUMBER-$SOURCE_SHA-$BASE_SHA" --no-wait'
          echo 'Comparison queued. The required relevance-lab/merge-gate status follows the results.'
