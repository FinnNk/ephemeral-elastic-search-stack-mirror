name: Reference release CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  release:
    # This privileged lab runner accepts trusted, same-repository changes only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: lab-delivery
    steps:
      - name: Fetch exact source revision
        env:
          SOURCE_URL: ${{ vars.SOURCE_BASE_URL || github.server_url }}/${{ github.repository }}.git
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_USER: ${{ secrets.SOURCE_USER }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          set -eu
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf '%s:%s' "$SOURCE_USER" "$SOURCE_TOKEN" | base64 | tr -d '\n')"
          git init source
          cd source
          git remote add origin "$SOURCE_URL"
          git fetch --depth 1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Test, build and publish immutable release
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_KIND: ${{ github.event_name }}
          REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          ARTIFACT_URL: ${{ vars.RELEASE_ARTIFACT_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -eu
          cd source
          sh ci/build.sh
      - name: Check selected offline variants
        if: github.event_name == 'pull_request'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          ARTIFACT_URL: ${{ vars.RELEASE_ARTIFACT_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          LAB_VARIANT_EVIDENCE_KEY: ${{ secrets.LAB_VARIANT_EVIDENCE_KEY }}
          LAB_VARIANT_APPROVAL_KEY: ${{ secrets.LAB_VARIANT_APPROVAL_KEY }}
          LAB_VARIANT_POLICY_SHA256: ${{ vars.LAB_VARIANT_POLICY_SHA256 }}
          LAB_VARIANT_GATE_CODE_SHA256: ${{ vars.LAB_VARIANT_GATE_CODE_SHA256 }}
        run: |
          set -eu
          cd source
          if test -f gate/selection.json; then
            test "$(sha256sum ci/variant_gate.py | cut -d ' ' -f 1)" = "$LAB_VARIANT_GATE_CODE_SHA256"
            PYTHON_IMAGE='python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844'
            docker run --rm -v "$PWD:/work" -w /work \
              -e SOURCE_SHA -e SOURCE_REPOSITORY -e ARTIFACT_URL -e NEXUS_USER -e NEXUS_PASSWORD \
              -e LAB_VARIANT_EVIDENCE_KEY -e LAB_VARIANT_APPROVAL_KEY \
              -e LAB_VARIANT_POLICY_SHA256 "$PYTHON_IMAGE" sh -ec '
                python ci/variant_gate_store.py fetch --source-sha "$SOURCE_SHA" --directory gate/evidence
                python ci/variant_gate.py --report gate/evidence/report.json \
                  --policy gate/policy.json --selection gate/selection.json \
                  --attestation gate/evidence/attestation.json \
                  --approvals-file gate/evidence/approvals.json \
                  --source-sha "$SOURCE_SHA" --build-receipt gate/evidence/build-receipt.json \
                  --source-repository "$SOURCE_REPOSITORY" --output gate/evidence/verdict.json'
          fi
