apiVersion: batch/v1
kind: Job
metadata:
  name: register-synthetic-esci-judge
  namespace: lab-models
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: nexus-read
      nodeSelector:
        kubernetes.io/hostname: k3d-observability-0
      containers:
        - name: register
          image: nexus.localhost:18185/relevance-judge:j1-6b51404e282f95d4-amd64@sha256:79d25437fe6d8d7838ce8a3979e4a0c716f7470701be5eef9a191edca26e1642
          command: [python, /app/noop_model.py]
          args:
            - --tracking-uri
            - http://mlflow-mlflow.lab-models.svc:5000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
