apiVersion: v1
kind: ConfigMap
metadata:
  name: judgement-model-pin
  namespace: lab-models
data:
  model.json: |
    {"name":"synthetic-esci-judge","version":"1","artifact_sha256":"364d0b0961e682ba1440ff570a6288631486c1362e2b68f328aafcf270e5d894"}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: judgement-service
  namespace: lab-models
automountServiceAccountToken: false
imagePullSecrets:
  - name: nexus-read
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: judgement-identity-cache
  namespace: lab-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: judgement-service
  namespace: lab-models
spec:
  selector:
    app: judgement-service
  ports:
    - name: http
      port: 18086
      targetPort: 18086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judgement-service
  namespace: lab-models
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: judgement-service
  template:
    metadata:
      labels:
        app: judgement-service
    spec:
      serviceAccountName: judgement-service
      nodeSelector:
        kubernetes.io/hostname: k3d-observability-0
      initContainers:
        - name: fetch-source
          image: nexus.localhost:18185/relevance-judge:j1-b6a821a49492315e-amd64
          command: [python, /app/fetch_source.py]
          args:
            - --judgement-manifest-sha256
            - f30d8e10880e774d2987555450d71b3f0186c2736b534238d0a2c90d2373c69d
            - --catalogue-manifest-sha256
            - e65c481acbb0f9917526841fd7ee51573104fb76e190805150c000d44f646c6a
            - --query-manifest-sha256
            - 144c51398442422cb638b6ef0f9df8c890e54afa6f3cad9383fbd1f93ad495fa
            - --output
            - /inputs
          env:
            - name: DATA_BLOB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: judgement-blob
                  key: DATA_BLOB_CONNECTION_STRING
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: inputs
              mountPath: /inputs
      containers:
        - name: judgement-service
          image: nexus.localhost:18185/relevance-judge:j1-b6a821a49492315e-amd64
          command: [python, /app/service.py]
          args:
            - --database
            - /state/labels.sqlite3
            - --source-judgements
            - /inputs/judgements.jsonl
            - --catalogue
            - /inputs/products.content
            - --queries
            - /inputs/queries.jsonl
            - --context
            - /inputs/context.json
            - --model
            - /config/model.json
            - --predict-url
            - http://synthetic-esci-judge-predictor.lab-models.svc/v1/models/judgement-model:predict
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lab-otel-gateway.lab-observability.svc.cluster.local:4318
            - name: LAB_SOURCE_PROFILE
              value: 10k
          ports:
            - name: http
              containerPort: 18086
          readinessProbe:
            httpGet:
              path: /health
              port: 18086
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: inputs
              mountPath: /inputs
              readOnly: true
            - name: state
              mountPath: /state
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: inputs
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: judgement-identity-cache
        - name: config
          configMap:
            name: judgement-model-pin
