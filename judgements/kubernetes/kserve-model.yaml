apiVersion: v1
kind: ServiceAccount
metadata:
  name: judgement-predictor
  namespace: lab-models
automountServiceAccountToken: false
imagePullSecrets:
  - name: nexus-read
---
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: mlflow-registered-version
spec:
  container:
    name: storage-initializer
    image: nexus.localhost:18185/relevance-judge:j1-b6a821a49492315e-amd64
    command: [python, /app/fetch_model.py]
    env:
      - name: MLFLOW_TRACKING_URI
        value: http://mlflow-mlflow.lab-models.svc:5000
      - name: GIT_PYTHON_REFRESH
        value: quiet
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  supportedUriFormats:
    - prefix: mlflow-registry://
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: synthetic-judge-runtime
  namespace: lab-models
spec:
  supportedModelFormats:
    - name: judgement-pyfunc
      version: "1"
      autoSelect: false
  containers:
    - name: kserve-container
      image: nexus.localhost:18185/relevance-judge:j1-b6a821a49492315e-amd64
      command: [python, /app/predictor.py]
      env:
        - name: MODEL_DIR
          value: /mnt/models
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://lab-otel-gateway.lab-observability.svc.cluster.local:4318
      ports:
        - containerPort: 8080
          name: http1
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 5
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: synthetic-esci-judge
  namespace: lab-models
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    serviceAccountName: judgement-predictor
    model:
      modelFormat:
        name: judgement-pyfunc
        version: "1"
      runtime: synthetic-judge-runtime
      storageUri: mlflow-registry://synthetic-esci-judge/1?sha256=364d0b0961e682ba1440ff570a6288631486c1362e2b68f328aafcf270e5d894
